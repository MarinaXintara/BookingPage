# App name
spring.application.name=backend

# Server
server.port=8080

# ===============================
# DATABASE (PostgreSQL)
# ===============================
spring.datasource.url=jdbc:postgresql://localhost:5433/my-postgres
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# (optional ???? ???? ??? ?? ??? ??????????)
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.defer-datasource-initialization=true

# Load src/main/resources/data.sql after Hibernate creates/updates the tables.
spring.sql.init.mode=always
spring.sql.init.continue-on-error=false

# ===============================
# LOGGING (optional ???? ???????)
# ===============================
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

#24 hours expiration
jwt.secret=ThisIsASecretKeyThatIsLongerThan32CharactersForJwtSigning123
jwt.expiration=86400000

#File-size configuration
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Local upload storage. Relative paths are resolved from the backend working directory.
app.upload.directory=uploads
